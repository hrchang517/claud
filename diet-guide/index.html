<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>맞춤 건강 식단 가이드</title>
<meta name="description" content="신장, 당뇨, 고혈압, 간기능, 다이어트별 맞춤 식단과 음식 정보를 확인하는 앱" />
<meta name="theme-color" content="#15803d" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="건강식단가이드" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="logo-badge">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 21s-7.5-4.6-10-9.3C.5 8.4 2.4 5 5.8 5c2 0 3.4 1.1 4.2 2.4C10.8 6.1 12.2 5 14.2 5c3.4 0 5.3 3.4 3.8 6.7C19.5 16.4 12 21 12 21z" fill="white"/>
      </svg>
    </div>
    <h1>맞춤 건강 식단 가이드</h1>
  </header>

  <main class="container">
    <nav class="category-tabs" id="categoryTabs"></nav>

    <div class="segmented" id="segmented">
      <button class="segment-btn active" data-mode="search">
        <svg class="icon" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        음식 검색
      </button>
      <button class="segment-btn" data-mode="plan">
        <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M8 3v4M16 3v4M4 9h16M6 5h12a2 2 0 012 2v12a2 2 0 01-2 2H6a2 2 0 01-2-2V7a2 2 0 012-2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        하루 식단 제안
      </button>
    </div>

    <section class="panel" id="searchPanel">
      <div class="panel-title">
        <svg class="icon icon-info" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 8h.01M11 12h1v5h1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span id="searchIntro"></span>
      </div>

      <div class="search-row">
        <input type="text" id="searchInput" placeholder="예: 바나나, 고구마, 잡곡밥..." autocomplete="off" />
        <button id="searchBtn" class="search-btn">
          <svg class="icon" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20L16.65 16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          검색
        </button>
      </div>

      <div class="chip-row" id="chipRow"></div>

      <div class="results" id="results"></div>

      <p class="note-line" id="searchNote"></p>
    </section>

    <section class="panel hidden" id="planPanel">
      <div class="panel-title">
        <svg class="icon icon-info" viewBox="0 0 24 24" fill="none"><path d="M8 3v4M16 3v4M4 9h16M6 5h12a2 2 0 012 2v12a2 2 0 01-2 2H6a2 2 0 01-2-2V7a2 2 0 012-2z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        맞춤형 하루 식단 생성
      </div>

      <label class="field-label" for="stageSelect">현재 건강 상태 또는 관리 단계</label>
      <select id="stageSelect" class="stage-select"></select>

      <button id="generateBtn" class="generate-btn">
        <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M4 4v5h5M20 20v-5h-5M4.5 9a7.5 7.5 0 0113-4.5L20 7M19.5 15a7.5 7.5 0 01-13 4.5L4 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        새로운 식단 제안받기
      </button>

      <div class="plan-result hidden" id="planResult">
        <div class="plan-result-header">
          <h2 id="planTitle"></h2>
          <button id="saveBtn" class="save-btn">
            <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M6 3h12a1 1 0 011 1v17l-7-4-7 4V4a1 1 0 011-1z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
            <span id="saveBtnLabel">이 식단 저장하기</span>
          </button>
        </div>
        <p class="meal-hint">각 음식을 클릭하면 간단한 레시피를 볼 수 있어요. 오늘의 추천 식단은 매일 자동으로 바뀌며, 버튼을 다시 누르면 다른 식단도 볼 수 있어요.</p>
        <div class="meal-grid" id="mealGrid"></div>
        <p class="note-line" id="planNote"></p>
      </div>

      <div class="saved-section">
        <h3>저장된 식단 <span id="savedCount" class="saved-count"></span></h3>
        <div class="saved-list" id="savedList"></div>
      </div>
    </section>
  </main>

  <footer class="app-footer">
    © 2026 맞춤 건강 식단 가이드. 본 정보는 참고용이며, 반드시 전문의나 영양사와 상담하십시오.
  </footer>

  <div class="modal-overlay hidden" id="recipeModal">
    <div class="modal-card">
      <button class="modal-close" id="modalClose" aria-label="닫기">
        <svg class="icon" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <h2 id="modalFoodName"></h2>
      <p class="modal-kcal" id="modalKcal"></p>
      <p class="modal-desc" id="modalDesc"></p>
      <div id="modalRecipeBody">
        <h3>재료</h3>
        <ul id="modalIngredients"></ul>
        <h3>만드는 법</h3>
        <ol id="modalSteps"></ol>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="recipes.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
