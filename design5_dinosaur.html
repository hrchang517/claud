<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>색칠책 - 공룡</title>
    <style>
        body { margin: 0; padding: 20px; background: white; display: flex; justify-content: center; }
        svg { max-width: 800px; border: 2px solid #333; }
    </style>
</head>
<body>
<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- 제목 -->
  <text x="400" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="black">공룡</text>

  <!-- 트리케라톱스 -->
  <g>
    <!-- 몸 -->
    <ellipse cx="300" cy="350" rx="120" ry="100" fill="none" stroke="black" stroke-width="2.5"/>
    <!-- 목 -->
    <path d="M 200 300 Q 150 250 120 180" fill="none" stroke="black" stroke-width="2.5"/>
    <!-- 머리 -->
    <circle cx="100" cy="150" r="50" fill="none" stroke="black" stroke-width="2.5"/>
    <!-- 뿔 1 (왼쪽 위) -->
    <path d="M 70 120 L 30 60" fill="none" stroke="black" stroke-width="2.5"/>
    <!-- 뿔 2 (오른쪽 위) -->
    <path d="M 130 120 L 170 60" fill="none" stroke="black" stroke-width="2.5"/>
    <!-- 뿔 3 (코) -->
    <path d="M 100 170 L 80 210" fill="none" stroke="black" stroke-width="2"/>
    <!-- 목의 플레이트 -->
    <path d="M 150 240 Q 180 200 200 160" fill="none" stroke="black" stroke-width="2"/>
    <path d="M 160 260 Q 190 220 210 180" fill="none" stroke="black" stroke-width="2"/>
    <path d="M 150 280 Q 180 240 200 200" fill="none" stroke="black" stroke-width="2"/>
    <!-- 눈 -->
    <circle cx="85" cy="140" r="6" fill="black"/>
    <!-- 꼬리 -->
    <path d="M 400 320 Q 500 300 580 280" fill="none" stroke="black" stroke-width="2.5"/>
    <path d="M 400 380 Q 500 400 580 420" fill="none" stroke="black" stroke-width="2.5"/>
    <!-- 다리 -->
    <rect x="250" y="440" width="30" height="150" rx="15" fill="none" stroke="black" stroke-width="2.5"/>
    <rect x="330" y="440" width="30" height="150" rx="15" fill="none" stroke="black" stroke-width="2.5"/>
    <!-- 발 -->
    <ellipse cx="265" cy="600" rx="20" ry="25" fill="none" stroke="black" stroke-width="2.5"/>
    <ellipse cx="345" cy="600" rx="20" ry="25" fill="none" stroke="black" stroke-width="2.5"/>
  </g>

  <!-- 스테고사우루스 -->
  <g>
    <!-- 몸 -->
    <ellipse cx="550" cy="550" rx="100" ry="80" fill="none" stroke="black" stroke-width="2.5"/>
    <!-- 목 -->
    <path d="M 480 520 Q 450 480 430 420" fill="none" stroke="black" stroke-width="2.5"/>
    <!-- 머리 -->
    <circle cx="410" cy="390" r="40" fill="none" stroke="black" stroke-width="2.5"/>
    <!-- 턱 -->
    <path d="M 380 410 Q 370 440 390 450" fill="none" stroke="black" stroke-width="2.5"/>
    <!-- 눈 -->
    <circle cx="420" cy="380" r="5" fill="black"/>
    <!-- 등의 판 -->
    <ellipse cx="500" cy="420" rx="25" ry="50" fill="none" stroke="black" stroke-width="2"/>
    <ellipse cx="540" cy="400" rx="28" ry="55" fill="none" stroke="black" stroke-width="2"/>
    <ellipse cx="580" cy="410" rx="25" ry="50" fill="none" stroke="black" stroke-width="2"/>
    <ellipse cx="620" cy="430" rx="23" ry="45" fill="none" stroke="black" stroke-width="2"/>
    <!-- 꼬리 -->
    <path d="M 630 550 Q 680 560 720 580" fill="none" stroke="black" stroke-width="2.5"/>
    <!-- 꼬리의 스파이크 -->
    <path d="M 680 540 L 700 500" fill="none" stroke="black" stroke-width="2"/>
    <path d="M 710 550 L 730 510" fill="none" stroke="black" stroke-width="2"/>
    <!-- 다리 -->
    <rect x="480" y="620" width="28" height="130" rx="14" fill="none" stroke="black" stroke-width="2.5"/>
    <rect x="580" y="620" width="28" height="130" rx="14" fill="none" stroke="black" stroke-width="2.5"/>
    <!-- 발 -->
    <ellipse cx="494" cy="760" rx="18" ry="22" fill="none" stroke="black" stroke-width="2.5"/>
    <ellipse cx="594" cy="760" rx="18" ry="22" fill="none" stroke="black" stroke-width="2.5"/>
  </g>

  <!-- 지형 -->
  <path d="M 0 800 Q 200 750 400 780 Q 600 810 800 800 L 800 1000 L 0 1000 Z" fill="none" stroke="black" stroke-width="2.5"/>
  <path d="M 100 850 Q 150 820 200 850" fill="none" stroke="black" stroke-width="2"/>
  <path d="M 600 820 Q 650 800 700 830" fill="none" stroke="black" stroke-width="2"/>
</svg>
</body>
</html>
