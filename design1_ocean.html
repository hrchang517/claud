<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>색칠책 - 해양 생물</title>
    <style>
        body { margin: 0; padding: 20px; background: white; display: flex; justify-content: center; }
        svg { max-width: 800px; border: 2px solid #333; }
    </style>
</head>
<body>
<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- 제목 -->
  <text x="400" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="black">해양 생물</text>

  <!-- 큰 물고기 -->
  <ellipse cx="300" cy="300" rx="120" ry="80" fill="none" stroke="black" stroke-width="2.5"/>
  <path d="M 420 300 L 500 250 L 500 350 Z" fill="none" stroke="black" stroke-width="2.5"/>
  <circle cx="350" cy="280" r="15" fill="none" stroke="black" stroke-width="2.5"/>
  <path d="M 200 250 Q 150 200 180 150" fill="none" stroke="black" stroke-width="2.5"/>
  <path d="M 200 350 Q 150 400 180 450" fill="none" stroke="black" stroke-width="2.5"/>
  <line x1="300" y1="380" x2="300" y2="450" stroke="black" stroke-width="2.5"/>

  <!-- 산호초 -->
  <path d="M 100 600 Q 80 550 100 500 Q 120 550 100 600" fill="none" stroke="black" stroke-width="2.5"/>
  <path d="M 150 650 Q 130 600 150 550 Q 170 600 150 650" fill="none" stroke="black" stroke-width="2.5"/>
  <path d="M 200 640 Q 180 590 200 540 Q 220 590 200 640" fill="none" stroke="black" stroke-width="2.5"/>
  <path d="M 250 660 Q 230 610 250 560 Q 270 610 250 660" fill="none" stroke="black" stroke-width="2.5"/>

  <!-- 해마 -->
  <path d="M 550 450 Q 560 350 550 300" fill="none" stroke="black" stroke-width="2.5"/>
  <circle cx="550" cy="280" r="25" fill="none" stroke="black" stroke-width="2.5"/>
  <ellipse cx="550" cy="500" rx="20" ry="40" fill="none" stroke="black" stroke-width="2.5"/>
  <path d="M 530 450 L 490 480" fill="none" stroke="black" stroke-width="2.5"/>
  <path d="M 570 450 L 610 480" fill="none" stroke="black" stroke-width="2.5"/>
  <path d="M 550 540 L 540 600" fill="none" stroke="black" stroke-width="2.5"/>

  <!-- 작은 물고기들 -->
  <g>
    <ellipse cx="400" cy="150" rx="40" ry="25" fill="none" stroke="black" stroke-width="2"/>
    <path d="M 440 150 L 480 130 L 480 170 Z" fill="none" stroke="black" stroke-width="2"/>
    <circle cx="420" cy="145" r="5" fill="none" stroke="black" stroke-width="2"/>
  </g>

  <g>
    <ellipse cx="650" cy="600" rx="45" ry="30" fill="none" stroke="black" stroke-width="2"/>
    <path d="M 695 600 L 740 570 L 740 630 Z" fill="none" stroke="black" stroke-width="2"/>
    <circle cx="670" cy="595" r="6" fill="none" stroke="black" stroke-width="2"/>
  </g>

  <!-- 버블들 -->
  <circle cx="150" cy="200" r="15" fill="none" stroke="black" stroke-width="1.5"/>
  <circle cx="200" cy="100" r="10" fill="none" stroke="black" stroke-width="1.5"/>
  <circle cx="700" cy="300" r="12" fill="none" stroke="black" stroke-width="1.5"/>
  <circle cx="600" cy="150" r="8" fill="none" stroke="black" stroke-width="1.5"/>
</svg>
</body>
</html>
