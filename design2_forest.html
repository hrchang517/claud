<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>색칠책 - 숲 동물</title>
    <style>
        body { margin: 0; padding: 20px; background: white; display: flex; justify-content: center; }
        svg { max-width: 800px; border: 2px solid #333; }
    </style>
</head>
<body>
<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- 제목 -->
  <text x="400" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="black">숲 동물</text>

  <!-- 사슴 -->
  <g>
    <!-- 머리 -->
    <circle cx="200" cy="200" r="50" fill="none" stroke="black" stroke-width="2.5"/>
    <!-- 뿔 -->
    <path d="M 170 160 L 140 80 L 155 140" fill="none" stroke="black" stroke-width="2.5"/>
    <path d="M 230 160 L 260 80 L 245 140" fill="none" stroke="black" stroke-width="2.5"/>
    <!-- 눈 -->
    <circle cx="185" cy="190" r="6" fill="none" stroke="black" stroke-width="2"/>
    <circle cx="215" cy="190" r="6" fill="none" stroke="black" stroke-width="2"/>
    <!-- 몸 -->
    <ellipse cx="200" cy="350" rx="70" ry="100" fill="none" stroke="black" stroke-width="2.5"/>
    <!-- 다리 -->
    <line x1="150" y1="430" x2="140" y2="550" stroke="black" stroke-width="2.5"/>
    <line x1="200" y1="440" x2="190" y2="560" stroke="black" stroke-width="2.5"/>
    <line x1="250" y1="440" x2="260" y2="560" stroke="black" stroke-width="2.5"/>
    <line x1="280" y1="430" x2="290" y2="550" stroke="black" stroke-width="2.5"/>
  </g>

  <!-- 여우 -->
  <g>
    <!-- 몸 -->
    <ellipse cx="550" cy="350" rx="80" ry="90" fill="none" stroke="black" stroke-width="2.5"/>
    <!-- 머리 -->
    <circle cx="550" cy="180" r="55" fill="none" stroke="black" stroke-width="2.5"/>
    <!-- 귀 -->
    <path d="M 510 140 L 490 60 L 515 120" fill="none" stroke="black" stroke-width="2.5"/>
    <path d="M 590 140 L 610 60 L 585 120" fill="none" stroke="black" stroke-width="2.5"/>
    <!-- 눈 -->
    <circle cx="535" cy="170" r="5" fill="black"/>
    <circle cx="565" cy="170" r="5" fill="black"/>
    <!-- 코 -->
    <path d="M 550 190 L 540 200 L 550 205 L 560 200 Z" fill="black"/>
    <!-- 꼬리 -->
    <path d="M 620 340 Q 700 300 720 200 Q 725 150 710 120" fill="none" stroke="black" stroke-width="2.5"/>
    <!-- 다리 -->
    <line x1="500" y1="430" x2="485" y2="560" stroke="black" stroke-width="2.5"/>
    <line x1="550" y1="440" x2="540" y2="570" stroke="black" stroke-width="2.5"/>
    <line x1="600" y1="440" x2="610" y2="570" stroke="black" stroke-width="2.5"/>
  </g>

  <!-- 곰 -->
  <g>
    <!-- 몸 -->
    <circle cx="350" cy="550" r="80" fill="none" stroke="black" stroke-width="2.5"/>
    <!-- 머리 -->
    <circle cx="350" cy="300" r="70" fill="none" stroke="black" stroke-width="2.5"/>
    <!-- 귀 -->
    <circle cx="300" cy="240" r="25" fill="none" stroke="black" stroke-width="2.5"/>
    <circle cx="400" cy="240" r="25" fill="none" stroke="black" stroke-width="2.5"/>
    <!-- 눈 -->
    <circle cx="330" cy="280" r="7" fill="black"/>
    <circle cx="370" cy="280" r="7" fill="black"/>
    <!-- 코 -->
    <ellipse cx="350" cy="310" rx="12" ry="15" fill="black"/>
    <!-- 다리 -->
    <rect x="300" y="620" width="25" height="100" rx="12" fill="none" stroke="black" stroke-width="2.5"/>
    <rect x="375" y="620" width="25" height="100" rx="12" fill="none" stroke="black" stroke-width="2.5"/>
    <ellipse cx="312" cy="720" rx="20" ry="15" fill="none" stroke="black" stroke-width="2.5"/>
    <ellipse cx="387" cy="720" rx="20" ry="15" fill="none" stroke="black" stroke-width="2.5"/>
  </g>

  <!-- 나무들 -->
  <path d="M 100 700 L 100 900" stroke="black" stroke-width="3"/>
  <path d="M 150 700 Q 80 650 100 550" fill="none" stroke="black" stroke-width="2.5"/>
  <path d="M 150 700 Q 220 650 200 550" fill="none" stroke="black" stroke-width="2.5"/>

  <path d="M 700 750 L 700 950" stroke="black" stroke-width="3"/>
  <path d="M 670 750 Q 620 700 650 600" fill="none" stroke="black" stroke-width="2.5"/>
  <path d="M 730 750 Q 780 700 750 600" fill="none" stroke="black" stroke-width="2.5"/>
</svg>
</body>
</html>
