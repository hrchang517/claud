<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>색칠책 - 정원</title>
    <style>
        body { margin: 0; padding: 20px; background: white; display: flex; justify-content: center; }
        svg { max-width: 800px; border: 2px solid #333; }
    </style>
</head>
<body>
<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <!-- 제목 -->
  <text x="400" y="40" font-size="24" font-weight="bold" text-anchor="middle" fill="black">정원 풍경</text>

  <!-- 해 -->
  <circle cx="100" cy="100" r="40" fill="none" stroke="black" stroke-width="2.5"/>
  <line x1="100" y1="30" x2="100" y2="-10" stroke="black" stroke-width="2.5"/>
  <line x1="100" y1="170" x2="100" y2="210" stroke="black" stroke-width="2.5"/>
  <line x1="30" y1="100" x2="-10" y2="100" stroke="black" stroke-width="2.5"/>
  <line x1="170" y1="100" x2="210" y2="100" stroke="black" stroke-width="2.5"/>

  <!-- 큰 꽃 1 -->
  <g>
    <!-- 줄기 -->
    <path d="M 300 900 Q 290 700 300 500" fill="none" stroke="black" stroke-width="2.5"/>
    <!-- 잎 -->
    <ellipse cx="250" cy="650" rx="30" ry="50" fill="none" stroke="black" stroke-width="2"/>
    <ellipse cx="350" cy="700" rx="30" ry="50" fill="none" stroke="black" stroke-width="2" transform="rotate(30 350 700)"/>
    <!-- 꽃잎 -->
    <ellipse cx="280" cy="450" rx="35" ry="60" fill="none" stroke="black" stroke-width="2.5"/>
    <ellipse cx="340" cy="460" rx="35" ry="60" fill="none" stroke="black" stroke-width="2.5" transform="rotate(72 340 460)"/>
    <ellipse cx="310" cy="400" rx="35" ry="60" fill="none" stroke="black" stroke-width="2.5" transform="rotate(144 310 400)"/>
    <ellipse cx="270" cy="400" rx="35" ry="60" fill="none" stroke="black" stroke-width="2.5" transform="rotate(216 270 400)"/>
    <ellipse cx="320" cy="480" rx="35" ry="60" fill="none" stroke="black" stroke-width="2.5" transform="rotate(288 320 480)"/>
    <!-- 중심 -->
    <circle cx="300" cy="450" r="20" fill="none" stroke="black" stroke-width="2.5"/>
  </g>

  <!-- 큰 꽃 2 -->
  <g>
    <!-- 줄기 -->
    <path d="M 550 920 Q 540 700 550 480" fill="none" stroke="black" stroke-width="2.5"/>
    <!-- 잎 -->
    <ellipse cx="480" cy="640" rx="25" ry="45" fill="none" stroke="black" stroke-width="2" transform="rotate(-30 480 640)"/>
    <ellipse cx="600" cy="680" rx="25" ry="45" fill="none" stroke="black" stroke-width="2" transform="rotate(30 600 680)"/>
    <!-- 꽃잎 -->
    <circle cx="550" cy="400" r="40" fill="none" stroke="black" stroke-width="2.5"/>
    <circle cx="610" cy="430" r="40" fill="none" stroke="black" stroke-width="2.5" transform="rotate(60 610 430)"/>
    <circle cx="610" cy="510" r="40" fill="none" stroke="black" stroke-width="2.5" transform="rotate(120 610 510)"/>
    <circle cx="550" cy="540" r="40" fill="none" stroke="black" stroke-width="2.5" transform="rotate(180 550 540)"/>
    <circle cx="490" cy="510" r="40" fill="none" stroke="black" stroke-width="2.5" transform="rotate(240 490 510)"/>
    <circle cx="490" cy="430" r="40" fill="none" stroke="black" stroke-width="2.5" transform="rotate(300 490 430)"/>
    <!-- 중심 -->
    <circle cx="550" cy="470" r="25" fill="none" stroke="black" stroke-width="2.5"/>
  </g>

  <!-- 작은 꽃들 -->
  <g>
    <path d="M 150 850 L 150 750" stroke="black" stroke-width="2"/>
    <circle cx="150" cy="740" r="15" fill="none" stroke="black" stroke-width="2"/>
    <circle cx="140" cy="730" r="8" fill="none" stroke="black" stroke-width="1.5"/>
    <circle cx="160" cy="730" r="8" fill="none" stroke="black" stroke-width="1.5"/>
    <circle cx="150" cy="720" r="8" fill="none" stroke="black" stroke-width="1.5"/>
  </g>

  <g>
    <path d="M 700 880 L 700 780" stroke="black" stroke-width="2"/>
    <circle cx="700" cy="770" r="12" fill="none" stroke="black" stroke-width="2"/>
    <circle cx="692" cy="762" r="6" fill="none" stroke="black" stroke-width="1.5"/>
    <circle cx="708" cy="762" r="6" fill="none" stroke="black" stroke-width="1.5"/>
  </g>

  <!-- 나비 -->
  <g>
    <!-- 왼쪽 날개 -->
    <ellipse cx="400" cy="300" rx="45" ry="60" fill="none" stroke="black" stroke-width="2.5"/>
    <!-- 오른쪽 날개 -->
    <ellipse cx="500" cy="300" rx="45" ry="60" fill="none" stroke="black" stroke-width="2.5"/>
    <!-- 몸 -->
    <ellipse cx="450" cy="310" rx="12" ry="40" fill="none" stroke="black" stroke-width="2.5"/>
    <!-- 더듬이 -->
    <path d="M 445 270 Q 435 240 430 200" fill="none" stroke="black" stroke-width="2"/>
    <path d="M 455 270 Q 465 240 470 200" fill="none" stroke="black" stroke-width="2"/>
    <!-- 날개 패턴 -->
    <circle cx="400" cy="280" r="10" fill="none" stroke="black" stroke-width="1.5"/>
    <circle cx="500" cy="280" r="10" fill="none" stroke="black" stroke-width="1.5"/>
  </g>

  <!-- 풀 -->
  <path d="M 50 900 Q 60 850 50 800" fill="none" stroke="black" stroke-width="2"/>
  <path d="M 100 920 Q 110 860 100 800" fill="none" stroke="black" stroke-width="2"/>
  <path d="M 200 930 Q 210 870 200 810" fill="none" stroke="black" stroke-width="2"/>
  <path d="M 650 920 Q 660 860 650 800" fill="none" stroke="black" stroke-width="2"/>
  <path d="M 750 930 Q 760 870 750 810" fill="none" stroke="black" stroke-width="2"/>
</svg>
</body>
</html>
